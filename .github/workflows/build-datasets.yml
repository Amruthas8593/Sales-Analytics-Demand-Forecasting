name: Build portfolio datasets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-datasets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Generate 50,000-row dataset
        working-directory: data
        run: python generate_dataset.py && python prepare_powerbi.py

      - name: Commit generated datasets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dairy_sales_50000.csv data/powerbi_ready_sales.csv
          git diff --cached --quiet || git commit -m 'Generate project datasets'
          git push
